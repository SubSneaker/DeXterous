name: GitHub release

# Creates the GitHub release when a version tag (v1.2.3) is pushed, with that
# version's section of CHANGELOG.md as the release notes. It runs next to the
# npm publish workflow but independently of it, so one failing doesn't stop
# the other. Prereleases (v1.2.0-rc.1) are marked as prereleases. Nothing is
# attached: DeXterous is installed from npm.
#
# To run it by hand (Actions > GitHub release > Run workflow), pick the tag
# under "Use workflow from". A release that already exists is left alone.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check the tag matches package.json
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Run this workflow from a version tag (Use workflow from > Tags), not from a branch."
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json, which says $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The lines between "## [X.Y.Z]" and the next "## " heading.
      - name: Take the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const version = process.env.VERSION;
            const lines = fs.readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/);
            const start = lines.findIndex((line) => line.startsWith(`## [${version}]`));
            if (start === -1) {
              console.log(`::error::CHANGELOG.md has no "## [${version}]" section.`);
              process.exit(1);
            }
            let end = lines.findIndex((line, i) => i > start && line.startsWith("## "));
            if (end === -1) end = lines.length;
            // Drop the link definitions at the bottom of the file, if the section runs into them.
            const section = lines.slice(start + 1, end).filter((line) => !/^\[[^\]]+\]: /.test(line));
            const notes = [
              section.join("\n").trim(),
              "",
              "Install or update with `npm install -g @subsneaker/dexterous`, or run it once with `npx @subsneaker/dexterous@latest`.",
            ].join("\n");
            fs.writeFileSync(process.env.RUNNER_TEMP + "/notes.md", notes + "\n");
          '
          cat "$RUNNER_TEMP/notes.md"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::The $GITHUB_REF_NAME release already exists, so it's left as it is."
            exit 0
          fi
          prerelease=()
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "DeXterous $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${prerelease[@]}"
